{% extends 'base.html' %}
{% block content %}
<div style="text-align: center; padding: 50px;">
    <h2>Application Received!</h2>
    <p>Thank you for applying. You can track your application status below.</p>

    <form action="/candidate/status" method="POST" style="margin: 20px 0;">
        <input type="hidden" name="email" value="{{ email }}">
        <button type="submit" class="btn btn-primary">View My Application Status</button>
    </form>

    <a href="/" style="color: #e74c3c; text-decoration: none; font-weight: bold;">Exit to Welcome Page</a>
</div>
{% endblock %}
