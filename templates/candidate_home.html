<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Application Center</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body" style="padding: 2rem; height: auto; min-height: 100vh;">
    <div class="login-card" style="max-width: 850px; width: 100%; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
            <h2>🏢 Active Career Openings</h2>
            <a href="{{ url_for('candidate_status') }}" class="btn btn-secondary" style="text-decoration: none; font-size: 0.9rem;">🔍 Check Application Status</a>
        </div>

        <div class="dashboard-split-layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div class="card-form" style="background: rgba(255,255,255,0.01); padding: 1.5rem; border: 1px solid var(--border-color);">
                <h3>Apply Now</h3>
                <form id="apply-form" method="POST" action="/candidate/apply" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="applicant_name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="applicant_email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label>Target Role</label>
                        <select name="job_id" required style="width: 100%; padding: 0.75rem; border-radius: 6px;">
                            {% for job in jobs %}<option value="{{ job.id }}">{{ job.title }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Attach Resume</label>
                        <input type="file" name="resume" required accept=".pdf,.docx">
                    </div>
                    <button type="submit" class="btn btn-success btn-block" style="background-color: #10b981; margin-top: 1rem;">Submit Application</button>
                </form>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem; max-height: 500px; overflow-y: auto;">
                <h3>Job Requirements</h3>
                {% for job in jobs %}
                    <div class="metric-card" style="border: 1px solid var(--border-color); padding: 1.25rem;">
                        <h4>{{ job.title }}</h4>
                        <p style="font-size: 0.85rem;"><strong>Required:</strong> {{ job.skills }}</p>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div id="smart-chatbot" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
        <button id="chat-trigger" style="background-color: #8b5cf6; color: white; border: none; width: 60px; height: 60px; border-radius: 50%; cursor: pointer;">💬</button>
        <div id="chat-window" style="display: none; width: 360px; height: 450px; background-color: #1e1e2e; border-radius: 12px; flex-direction: column; position: absolute; bottom: 80px; right: 0;">
            <div style="background-color: #8b5cf6; padding: 1rem; color: white; display: flex; justify-content: space-between;">
                <span>🤖 SmartHire AI</span>
                <button id="chat-close" style="background:none; border:none; color:white; cursor:pointer;">×</button>
            </div>
            <div id="chat-messages" style="flex: 1; padding: 1rem; overflow-y: auto; color: white;"></div>
            <div style="padding: 0.75rem; border-top: 1px solid #313244;">
                <input type="text" id="chat-input" placeholder="Ask about the role..." style="width: 70%; padding: 0.5rem;">
                <button id="chat-send" style="padding: 0.5rem;">Send</button>
            </div>
        </div>
    </div>

    <script>
    const chatWin = document.getElementById("chat-window");
    document.getElementById("chat-trigger").onclick = () => chatWin.style.display = "flex";
    document.getElementById("chat-close").onclick = () => chatWin.style.display = "none";

    document.getElementById("chat-send").onclick = async () => {
        const input = document.getElementById("chat-input");
        const chatMsgs = document.getElementById("chat-messages");
        const jobSelect = document.querySelector('select[name="job_id"]');
        const jobTitle = jobSelect.options[jobSelect.selectedIndex].text;
        
        if (!input.value.trim()) return;

        // Display user message
        chatMsgs.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
        const userMessage = input.value;
        input.value = "";
        
        // Add loading indicator
        chatMsgs.innerHTML += `<p id="loading"><i>AI is thinking...</i></p>`;
        chatMsgs.scrollTop = chatMsgs.scrollHeight;

        try {
            const res = await fetch('/api/chatbot/query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                // We send the Job Title so the AI knows which role the user is asking about
                body: JSON.stringify({ 
                    message: `Regarding the ${jobTitle} position: ${userMessage}` 
                })
            });
            const data = await res.json();
            
            // Remove loading and show response
            document.getElementById("loading").remove();
            chatMsgs.innerHTML += `<p><b>AI:</b> ${data.reply}</p>`;
        } catch (err) {
            document.getElementById("loading").remove();
            chatMsgs.innerHTML += `<p style="color:red;">Error: Could not connect to AI service.</p>`;
        }
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
    };
    // --- DYNAMIC FORM ACTION UPDATER ---
    
</script>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div style="background: #10b981; color: white; padding: 1rem; margin-bottom: 1rem; border-radius: 6px; text-align: center;">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}
</body>
</html>
