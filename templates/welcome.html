<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartHire AI Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div class="login-card" style="text-align: center; max-width: 500px; padding: 3rem;">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: #fff;">Smart<span style="color: #8b5cf6;">Hire</span> AI</h1>
        <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Next-Generation Talent Acquisition Platform</p>
        
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
            <a href="{{ url_for('candidate_home') }}" class="btn btn-primary" style="background-color: #8b5cf6; padding: 1.2rem; font-size: 1.1rem; text-decoration: none; border-radius: 8px;">
                🚀 Enter as Candidate
            </a>
            <div style="color: var(--text-muted); font-size: 0.9rem; margin: 0.2rem 0;">OR</div>
            <a href="{{ url_for('login') }}" class="btn btn-secondary" style="padding: 1.2rem; font-size: 1.1rem; text-decoration: none; border-radius: 8px; border: 1px solid var(--border-color);">
                💼 Enter as HR Recruiter (Admin)
            </a>
        </div>
    </div>

</html>
