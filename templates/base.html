<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire ATS - Advanced Recruiter Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* 🌗 UNIFIED GLOBAL THEME PALETTE & TYPOGRAPHY SYSTEM */
        :root {
            --body-bg: #0f172a;
            --text-color: #cbd5e1;
            --panel-bg: #1e293b;
            --sidebar-bg: #0f172a;
            --border-color: #334155;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        [data-theme="light"] {
            --body-bg: #f4f6f9;
            --text-color: #1e293b;
            --panel-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        /* Standardize layout baseline typography */
        body, html {
            font-family: var(--font-stack);
            background-color: var(--body-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Force consistent headline styles everywhere */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-stack);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-color) !important;
        }

        /* App container structure layout matrix */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            box-sizing: border-box;
            background-color: var(--body-bg);
            transition: background-color 0.2s ease;
        }

        /* 👥 SIDEBAR ELEMENT TYPOGRAPHY & THEME MATCHING */
        .sidebar {
            font-family: var(--font-stack);
            background-color: var(--sidebar-bg) !important;
            border-right: 1px solid var(--border-color);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 260px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .nav-item {
            font-family: var(--font-stack);
            font-weight: 500;
            color: var(--text-color) !important;
            text-decoration: none;
            padding: 12px 14px;
            display: block;
            border-radius: 6px;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        
        .nav-item:hover {
            background-color: rgba(52, 152, 219, 0.1); 
        }
        
        .user-name {
            font-family: var(--font-stack);
            font-weight: 600;
            color: var(--text-color) !important;
            margin-bottom: 8px;
        }

        .brand {
            font-family: var(--font-stack); 
            font-weight: 700;
            color: var(--text-color) !important;
            font-size: 22px;
            margin-bottom: 2.5rem;
        }

        /* 🎙️ UNIFIED VOICE ASSISTANT COMPONENT THEMING */
        .voice-assistant-panel {
            background-color: var(--panel-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-color) !important;
            border-radius: 8px;
            font-family: var(--font-stack);
        }

        .voice-action-btn {
            font-family: var(--font-stack);
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: var(--body-bg);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .voice-speech-bubble {
            background-color: var(--body-bg) !important;
            color: var(--text-color) !important;
            border: 1px solid var(--border-color) !important;
            font-family: var(--font-stack);
            font-size: 13px;
        }

        /* 🌗 UNIFIED THEME TOGGLE ELEMENT */
        .theme-action-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            margin-left: 10px;
            transition: transform 0.1s ease;
        }
        .theme-action-toggle:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div class="app-container" id="auth-guard-wrapper" style="display: none;">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <span class="logo-icon">⚡</span> SmartHire <span style="color: #3498db;">AI</span>
                </div>
                <nav class="menu" style="display: flex; flex-direction: column; gap: 8px;">
                    <a href="{{ url_for('dashboard') }}" class="nav-item" id="nav-dashboard">📊 Dashboard</a>
                    <a href="{{ url_for('jobs') }}" class="nav-item" id="nav-jobs">💼 Job Postings</a>
                    <a href="{{ url_for('candidates') }}" class="nav-item" id="nav-candidates">👥 Candidates</a>
                    <a href="{{ url_for('reports') }}" class="nav-item" id="nav-reports">📈 Business Analytics</a>
                </nav>
            </div>
            <div class="user-profile" style="border-top: 1px solid var(--border-color); padding-top: 15px;">
                <p class="user-name">👤 Admin Operator</p>
                <button id="logout-btn" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:700; padding:0; font-size: inherit; font-family:inherit;">Session Exit</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); margin-bottom: 2rem; padding-bottom: 1rem;">
                <h1 class="page-title" style="margin: 0; font-size: 24px;">{% block page_title %}{% endblock %}</h1>
                
                <div class="voice-assistant-panel" style="display: flex; align-items: center; gap: 10px; padding: 6px 12px;">
                    <div id="voice-status-glow" class="status-indicator"></div>
                    <button id="voice-toggle-btn" class="voice-action-btn">
                        <span class="mic-icon">🎤</span> <span id="voice-btn-text">Start Voice Assistant</span>
                    </button>
                    <p id="voice-speech-output" class="voice-speech-bubble" style="margin: 0; padding: 6px 12px; border-radius: 4px;">Awaiting voice trigger instruction...</p>
                    
                    <button id="theme-toggle" class="theme-action-toggle" title="Toggle Display Mode">🌙</button>
                </div>
            </header>
            
            <section class="content-body">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    
    <script>
    // --- 🌗 CORE GLOBAL LIGHT/DARK DISPLAY MODE TOGGLE MANAGER ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const currentSavedTheme = localStorage.getItem('theme') || 'dark';
    
    document.documentElement.setAttribute('data-theme', currentSavedTheme);
    themeToggleBtn.textContent = currentSavedTheme === 'dark' ? '☀️' : '🌙';

    themeToggleBtn.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // --- 🔐 SECURE FIREBASE SESSION INTERCEPT ROUTE GUARD LAYER ---
// --- 🔐 SECURE FIREBASE SESSION INTERCEPT ROUTE GUARD LAYER ---
    const firebaseConfig = {
        apiKey: "AIzaSyAY1kmgvtiS16DMvbs1bnqtmvrRIEUjX9U",
        authDomain: "smarthire-651d3.firebaseapp.com",
        projectId: "smarthire-651d3",
        storageBucket: "smarthire-651d3.firebasestorage.app",
        messagingSenderId: "872834667590",
        appId: "1:872834667590:web:0d22fbb2ea12551d072647",
        measurementId: "G-XKTTLEMP72"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    // Change this part in base.html
// 🔐 SECURE FIREBASE SESSION INTERCEPT ROUTE GUARD LAYER
// 🔐 SECURE FIREBASE SESSION INTERCEPT ROUTE GUARD LAYER
firebase.auth().onAuthStateChanged((user) => {
    const currentPath = window.location.pathname;
    
    // Whitelist public pages (These pages will NOT trigger a redirect to login)
    const publicRoutes = ['/login', '/thank-you', '/', '/candidate', '/candidate/status', '/candidate/apply'];
    
    if (publicRoutes.includes(currentPath)) {
        document.getElementById('auth-guard-wrapper').style.display = 'flex';
        return; 
    }

    // Admin routes
    const adminRoutes = ['/dashboard', '/jobs', '/candidates', '/reports'];
    if (adminRoutes.includes(currentPath)) {
        document.getElementById('auth-guard-wrapper').style.display = 'flex';
        return;
    }

    // Protect all other routes
    if (!user) {
        window.location.href = "/login";
    } else {
        db.collection("users").doc(user.email.toLowerCase().trim()).get()
            .then((doc) => {
                if (doc.exists && doc.data().role === "admin") {
                    document.getElementById('auth-guard-wrapper').style.display = 'flex';
                } else {
                    window.location.href = "/login";
                }
            }).catch(() => { window.location.href = "/login"; });
    }
});

    document.getElementById('logout-btn').addEventListener('click', (e) => {
        e.preventDefault();
        firebase.auth().signOut().then(() => {
            // This now takes you to the Flask route, and the guard won't interfere
            window.location.href = "/logout";
        });
    });

    // --- 🎙️ NATIVE MICROPHONE SUBSYSTEM MATRIX ---
    // --- 🎙️ NATIVE MICROPHONE SUBSYSTEM MATRIX ---
window.addEventListener("load", function () {
    const voiceBtn = document.getElementById("voice-toggle-btn");
    const voiceBtnText = document.getElementById("voice-btn-text");
    const voiceBubble = document.getElementById("voice-speech-output");

    if (!voiceBtn) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
// Add this check inside your window load function
window.speechSynthesis.onvoiceschanged = () => {
    console.log("System voices loaded.");
};
    function speakSystemResponse(text) {
    // 1. Cancel previous pending speech
    window.speechSynthesis.cancel();

    // 2. Create the utterance
    const utterance = new SpeechSynthesisUtterance(text);
    
    // 3. FORCE the voice to initialize (sometimes browsers need this)
    const voices = window.speechSynthesis.getVoices();
    utterance.voice = voices[0]; 
    utterance.volume = 1;
    utterance.rate = 1;
    utterance.pitch = 1;

    // 4. Log to see if it's even trying
    console.log("Attempting to speak:", text);
    
    window.speechSynthesis.speak(utterance);
}

    voiceBtn.onclick = function (e) {
        e.preventDefault();
        recognition.start();
        if (voiceBtnText) voiceBtnText.textContent = "Listening...";
    };

    recognition.onend = () => {
        if (voiceBtnText) voiceBtnText.textContent = "Start Voice Assistant";
    };

    recognition.onresult = async function (event) {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        if (voiceBubble) voiceBubble.textContent = `You said: "${command}"`;

        // 1. Navigation Logic
        if (command.includes("jobs")) { window.location.href = "/jobs"; return; }
        if (command.includes("candidates")) { window.location.href = "/candidates"; return; }
        if (command.includes("dashboard")) { window.location.href = "/dashboard"; return; }

        // 2. Intelligence Logic
        try {
            if (command.includes("stats")) {
                const res = await fetch('/api/voice/stats');
                const data = await res.json();
                speakSystemResponse(`We have ${data.total} applicants, with a top score of ${data.top_score} percent.`);
            } else if (command.includes("find")) {
                const name = command.replace("find", "").trim();
                const res = await fetch(`/api/voice/candidate/${encodeURIComponent(name)}`);
                const data = await res.json();
                speakSystemResponse(data.found ? `${data.name} has a score of ${data.score}.` : "Candidate not found.");
            }
        } catch (err) {
            console.error("Voice Error:", err);
        }
    };
});
    </script>
</body>
</html>
